<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#253B35">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌳%3C/text%3E%3C/svg%3E">
<title data-dev-title="TALELIA 마을 프로토타입">TALELIA · 마을</title>
<script src="js/devmode.js?v=ec223e365bf9"></script>
<!-- 2.5D 동물 마을 프로토타입 (1단계: 땅 + 카메라 · 2단계: 건물 · 장식 · 건물 정보 · 3단계: 동물 이동)
     · 그림 파일은 기존 images/chars/pebble_golem.webp (말랑이) 하나만 씁니다. (같은 폴더 안 · 외부 요청 아님)
     · 로그인 · 서버 호출 없음. 고정 예제 데이터만 사용합니다. (supabase · fit-village-api 를 불러오지 않음)
     · 외부 글꼴도 불러오지 않습니다. 이 폴더 안의 파일만 요청합니다.
     · 기존 화면(index.html)과 기존 게임 엔진은 건드리지 않습니다.
     · 주소 끝에 ?debug=1 을 붙이면 구역 이름 · 좌표 · 누른 칸을 보여 줍니다. -->
<link rel="stylesheet" href="css/reset.css?v=ec223e365bf9">
<link rel="stylesheet" href="css/variables.css?v=ec223e365bf9">
<link rel="stylesheet" href="css/components.css?v=ec223e365bf9">
<link rel="stylesheet" href="css/town.css?v=ec223e365bf9">
</head>
<body>
<main id="town" class="town">
  <!-- 마을 (화면 전체 · 끌어서 이동 · 확대) -->
  <div id="townViewport" class="town-viewport" tabindex="0" role="application" aria-label="마을 지도. 끌어서 이동하고, 두 손가락이나 휠로 확대합니다. 화살표 키로 이동, 더하기·빼기 키로 확대, 0 키로 전체 보기.">
    <div id="townCamera" class="town-camera"></div>
  </div>

  <!-- 상단 HUD (예제 값 · 표시만) -->
  <header id="townHud" class="town-hud">
    <div class="tl-hud__profile">
      <span class="tl-hud__avatar">🐰</span>
      <span class="tl-hud__who"><b>테일리아 마을</b><small data-hud="level" data-dev-only>Lv.1</small></span>
    </div>
    <div class="town-hud__res">
  <span class="tl-res" title="정령석 (소환 재화 · 저장에서 읽기만 함)">💠 <b data-hud="stones">0</b></span>
      <span class="tl-res" title="골드 (장비 강화 재화 · 저장에서 읽기만 함)">🪙 <b data-hud="gold">0</b></span>
    </div>
    <div class="town-hud__tools">
      <span class="tl-env" title="서버에 연결하지 않고, 아무것도 저장하지 않습니다." data-dev-only>프로토타입</span>
      <button type="button" id="townSettings" class="town-settings"><span aria-hidden="true">⚙️</span> 설정</button>
    </div>
  </header>

  <!-- 확대 · 축소 -->
  <div class="town-zoom" aria-label="화면 확대 축소">
    <button id="townZoomIn" class="tl-icon-btn" aria-label="확대">＋</button>
    <button id="townZoomOut" class="tl-icon-btn" aria-label="축소">－</button>
    <button id="townZoomFit" class="tl-icon-btn" aria-label="마을 전체 보기">⌖</button>
  </div>

  <!-- 하단 메뉴 = 마을 허브 진입점 5칸 (H3 · js/town/hub.js · 던전은 1-6 첫 클리어 전까지 잠김 표시) -->
  <nav id="townNav" class="town-nav" aria-label="주 메뉴">
    <button type="button" id="townNavStory" data-go="story"><span>📖</span>스토리</button>
    <button type="button" id="townNavDungeon" data-go="dungeon"><span>⚔️</span>던전</button>
    <button type="button" id="townNavSummon" data-go="summon"><span>✨</span>소환</button>
    <button type="button" id="townNavGear" data-go="gear"><span>🛡️</span>장비</button>
    <button type="button" id="townNavDex" data-go="dex"><span>📚</span>도감</button>
  </nav>

  <div id="townToast" class="town-toast" role="status" hidden></div>
  <input type="file" id="townSaveFile" accept=".json,application/json" aria-label="백업 파일 고르기" hidden>
  <div id="townDebug" class="town-debug" hidden></div>
</main>

<!-- ui.js : 기존 공통 도우미(하단 시트 · esc). 서버를 부르지 않는 파일이며 고치지 않고 그대로 씁니다. -->
<script src="js/ui.js?v=ec223e365bf9"></script>
<script src="js/town/iso.js?v=ec223e365bf9"></script>
<script src="js/town/world-data.js?v=ec223e365bf9"></script>
<script src="js/town/ground.js?v=ec223e365bf9"></script>
<script src="js/town/art.js?v=ec223e365bf9"></script>
<script src="js/town/buildings.js?v=ec223e365bf9"></script>
<script src="js/town/scene.js?v=ec223e365bf9"></script>
<script src="js/town/pathfind.js?v=ec223e365bf9"></script>
<script src="js/town/behavior.js?v=ec223e365bf9"></script>
<script src="js/town/actors.js?v=ec223e365bf9"></script>
<script src="js/town/camera.js?v=ec223e365bf9"></script>
<!-- 그래픽 교체 기반 (T1): 매니페스트(지금은 비어 있음) · 검사 · SVG 와 그림 파일 공존. ?gfx=svg = 매니페스트 무시 · ?gfx=debug = 기준점 겹쳐 보기 -->
<script src="images/talelia/manifest.js?v=ec223e365bf9"></script>
<script src="js/town/assets.js?v=ec223e365bf9"></script>
<script src="js/town/gfx.js?v=ec223e365bf9"></script>
<!-- 스테이지 연결 (S4): 마을 구경(ch1_01)을 끝낸 표시 · 안내 ① 뽑기 · 모험 메뉴 = stage.html · 뽑기 저장(localStorage)만 읽고 씀 · 서버 연결 없음 -->
<script src="data/gacha/species.js?v=ec223e365bf9"></script>
<script src="js/gacha/rules.js?v=ec223e365bf9"></script>
<script src="js/gacha/store.js?v=ec223e365bf9"></script>
<script src="data/stage/chapter1.js?v=ec223e365bf9"></script>
<script src="js/stage/rules.js?v=ec223e365bf9"></script>
<script src="data/names.js?v=ec223e365bf9"></script>
<script src="js/names.js?v=ec223e365bf9"></script>
<script>TaleliaNames.applyFromStorage(new URLSearchParams(location.search).get("savekey") || undefined);</script>   <!-- 주인공 이름 (24호 → 엘피): 1-1 클리어 저장이면 표시 이름만 바꿈 -->
<script src="js/story/progress.js?v=ec223e365bf9"></script>
<script src="js/town/stage-link.js?v=ec223e365bf9"></script>
<script src="js/town/hub.js?v=ec223e365bf9"></script>
<!-- 설정 (저장 백업 · 불러오기 · 처음부터 다시): 장비 데이터 · 규칙은 불러올 파일 검사에만 씀 -->
<script src="data/gacha/equipment.js?v=ec223e365bf9"></script>
<script src="js/gacha/gear.js?v=ec223e365bf9"></script>
<script src="js/save-backup.js?v=ec223e365bf9"></script>
<script src="js/town/settings.js?v=ec223e365bf9"></script>
<script src="js/town/town.js?v=ec223e365bf9"></script>
</body>
</html>
