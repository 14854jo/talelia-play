<title>TALELIA · 테일리아</title>
<style>html,body{margin:0;height:100%;background:#253B35;color:#F4ECD8;font-family:system-ui,'Malgun Gothic',sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center}a{color:#D7B779}</style>
<script src="js/story/progress.js?v=1f4dce3c9d6a"></script>
<script>
/* 입구 (배포 빌드가 만듦 · 저장은 읽기만): 마을 구경을 끝낸 저장(stage.intro 참 · 클리어 · 뽑기 기록)이면 마을, 아니면 프롤로그
   저장이 없거나 망가졌거나 읽을 수 없으면 프롤로그 · 프롤로그는 중간 저장(talelia.story.progress)이 있으면 그 장면부터 · ?savekey 는 그대로 넘김 */
(function(){
  var q = new URLSearchParams(location.search), sk = q.get('savekey'), go = 'story.html', save = null;
  try{ var raw = localStorage.getItem(sk || 'talelia.gacha.v1'); if(raw != null) save = JSON.parse(raw); }catch(e){ save = null; }
  try{ if(window.TaleliaProgress && window.TaleliaProgress.started(save)) go = 'town.html'; }catch(e){}
  window.__entry = go;
  if(q.get('entry') === 'stay') return;   /* 시험용: 이동하지 않고 고른 곳만 남김 */
  location.replace(go + (sk ? '?savekey=' + encodeURIComponent(sk) : ''));
})();
</script>
</head>
<body><p>테일리아로 가는 중… <noscript>이 게임은 JavaScript 가 필요해요.</noscript><a href="story.html">바로 가기</a></p></body>
